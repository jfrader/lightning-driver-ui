services:
  bitcoind:
    image: polarlightning/bitcoind:29.0@sha256:4521294ac25fdbf1492a8cc5ea987463a5f244b82546d29bbe8451db39f36f3a
    command:
      - -regtest
      - -server=1
      - -rpcuser=polar
      - -rpcpassword=polar
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -fallbackfee=0.0002
      - -txindex=1
      - -zmqpubrawblock=tcp://0.0.0.0:28332
      - -zmqpubrawtx=tcp://0.0.0.0:28333
      - -printtoconsole
    volumes:
      - ${E2E_DATA:?E2E_DATA is required}/bitcoind:/home/bitcoin/.bitcoin
    ports:
      - "127.0.0.1:18443:18443"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bitcoin-cli -regtest -rpcuser=polar -rpcpassword=polar getblockchaininfo >/dev/null",
        ]
      interval: 2s
      timeout: 5s
      retries: 60

  lnd:
    image: polarlightning/lnd:0.19.2-beta@sha256:cfeb4debcce182c32bca3f06738d2c370b190b31a24905fb78b92f6c6ff52674
    command:
      - --bitcoin.active
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=bitcoind:18443
      - --bitcoind.rpcuser=polar
      - --bitcoind.rpcpass=polar
      - --bitcoind.zmqpubrawblock=tcp://bitcoind:28332
      - --bitcoind.zmqpubrawtx=tcp://bitcoind:28333
      - --noseedbackup
      - --alias=lnd1
      - --rpclisten=0.0.0.0:10009
      - --restlisten=0.0.0.0:8080
      - --listen=0.0.0.0:9735
      - --tlsextradomain=localhost
      - --tlsextraip=127.0.0.1
    volumes:
      - ${E2E_DATA:?E2E_DATA is required}/lnd:/home/lnd/.lnd
    ports:
      - "10009:10009"
      - "8081:8080"
      - "9735:9735"
    depends_on:
      bitcoind:
        condition: service_healthy

  cln:
    image: polarlightning/clightning:25.09.3@sha256:63820cc521774f2abe0cf530ff4632c138a7bea85e10cad2978e694817a2e8c1
    command:
      - --network=regtest
      - --bitcoin-rpcuser=polar
      - --bitcoin-rpcpassword=polar
      - --bitcoin-rpcconnect=bitcoind
      - --bitcoin-rpcport=18443
      - --lightning-dir=/home/clightning/.lightning
      - --addr=0.0.0.0:9735
      - --clnrest-port=3010
      - --clnrest-host=0.0.0.0
      - --clnrest-protocol=https
      - --clnrest-certs=/home/clightning/.lightning/certs
      - --log-level=info
      - --log-file=/home/clightning/.lightning/lightningd.log
    volumes:
      - ${E2E_DATA:?E2E_DATA is required}/cln:/home/clightning/.lightning
    ports:
      - "3011:3010"
      - "9835:9735"
    depends_on:
      bitcoind:
        condition: service_healthy
