name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the real regtest e2e (needs Docker on the runner)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: [self-hosted, mifulbo-ci]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve Chromium
        run: |
          path=$(command -v chromium || command -v chromium-browser || true)
          if [ -z "$path" ]; then
            echo "::error::Chromium is required for the browser suite"
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$path" >> "$GITHUB_ENV"
      - name: Verify
        run: npm run verify

  real-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: [self-hosted, mifulbo-ci]
    env:
      LIGHTNING_DRIVER_BACKEND: ${{ github.workspace }}/backend
      E2E_DATA: ${{ runner.temp }}/lightning-driver-e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: jfrader/lightning-driver
          path: backend
          token: ${{ secrets.LIGHTNING_DRIVER_CHECKOUT_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Docker
        run: docker info
      - run: npm ci
      - name: Build the API
        run: cargo build --release -p api-server
        working-directory: backend
      - name: Real regtest e2e
        run: npm run test:e2e
